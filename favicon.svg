<!-- This section of code is for the logo of the game -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#9ed8f5"/> <!-- This is the code for the blue sky background -->
  <circle cx="13" cy="13" r="8" fill="#ffd45c"/> <!-- This is the code for the sun -->
  <path d="M7 48h21v5H7zm42-12h13v5H49z" fill="#6f9e55"/> <!-- This is the code for the platforms -->
  <path d="M57 36V22" stroke="#554332" stroke-width="2"/> <!-- This is the code for the flag pole -->
  <path d="M58 22l6 3-6 3z" fill="#e64b3c"/> <!-- This is the code for the actually flag -->
  <rect x="10" y="34" width="14" height="14" fill="#f29e4c"/> <!-- This is the code for Q's body -->
  <circle cx="14" cy="39" r="1.2" fill="#222"/> <!-- This, and the line below, are the lines of for code Q's eyes -->
  <circle cx="20" cy="39" r="1.2" fill="#222"/>
  <path d="M14 43c1 3 5 3 6 0" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/> <!-- This is the code for Q's smile, the line below makes sure both smiles are rightside up -->
  <g transform="rotate(-10 37 28)">
    <rect x="30" y="21" width="14" height="14" fill="#e8d4b8"/> <!-- This is the code for A's body -->
    <circle cx="34" cy="26" r="1.2" fill="#222"/> <!-- This, and the line below, are the lines of code for A's eyes -->
    <circle cx="40" cy="26" r="1.2" fill="#222"/>
    <path d="M34 30c1 3 5 3 6 0" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/> <!-- This is the code for A's smile -->
  </g>
</svg>
